<!DOCTYPE html>
<html lang="en" data-theme="aurora">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glint - Diff</title>
    <link rel="stylesheet" href="vendor/tabler/tabler-icons.min.css" />
    <link rel="stylesheet" href="diff.css" />
  </head>
  <body>
    <header class="dhead">
      <span class="dstatus" id="status" hidden></span>
      <h1 class="dfile" id="file">-</h1>
      <span class="dcounts">
        <span class="add" id="adds" aria-hidden="true">+0</span>
        <span class="del" id="dels" aria-hidden="true">-0</span>
        <span class="sr-only" id="counts-sr"></span>
      </span>
    </header>
    <!-- tabindex makes the scroll area keyboard-focusable so arrow/Page keys
         scroll the diff; labelled by the file name heading. -->
    <main class="dbody" id="body" tabindex="0" aria-labelledby="file"></main>

    <script src="i18n.js"></script>
    <script src="themes.js"></script>
    <script src="diff.js"></script>
  </body>
</html>
